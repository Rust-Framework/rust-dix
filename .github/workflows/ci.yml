name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        rust: ["1.95", stable]
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (${{ matrix.rust }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Manifest encoding (no UTF-8 BOM)
        if: matrix.rust == 'stable' && matrix.os == 'ubuntu-latest'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifests = [Path("Cargo.toml"), *Path("crates").glob("*/Cargo.toml")]
          bad = [str(p) for p in manifests if p.read_bytes().startswith(b"\xef\xbb\xbf")]
          if bad:
              raise SystemExit(f"UTF-8 BOM found in manifests: {bad}")
          print(f"manifest encoding OK ({len(manifests)} files, no BOM)")
          PY

      - name: Formatting
        if: matrix.rust == 'stable' && matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        if: matrix.rust == 'stable' && matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: rust-core stays contract-only
        if: matrix.rust == 'stable' && matrix.os == 'ubuntu-latest'
        # The contract layer must not pull a framework or an async/runtime stack;
        # it is serde/serde_json only (feedback §32 and plan §3.6).
        run: |
          if cargo tree -p rust-core -e normal --prefix none \
            | grep -Eq '^(rust-dix|rust-ef|rust-webx|tokio|hyper|async-trait) '; then
            echo "error: rust-core depends on a framework/runtime crate" >&2
            exit 1
          fi
          echo "ok: rust-core is contract-only"

      - name: Documentation (deny warnings)
        if: matrix.rust == 'stable' && matrix.os == 'ubuntu-latest'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

      - name: Test workspace
        run: cargo test --workspace

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Run RustSec audit
        run: cargo audit --color never
