name: Publish to crates.io

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve tag version
        id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Pre-publish gates
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
          cargo test --workspace

      - name: Publish crates (dependency order, idempotent + index wait)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          TAG_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN secret is not set."
            exit 1
          fi
          # Publish order: dependencies must appear before their dependents.
          # crates.io's sparse index needs a moment to expose a newly published
          # version; retry the dependent crate until it resolves. A rerun after a
          # partial failure is safe: "already uploaded" is treated as success.
          CRATES="rust-dix-macros rust-dix"
          metadata="$(cargo metadata --no-deps --format-version 1)"
          for name in $CRATES; do
            version="$(printf '%s' "$metadata" \
              | jq -r --arg n "$name" '.packages[] | select(.name==$n) | .version')"
            if [ "$version" != "${TAG_VERSION}" ]; then
              echo "::warning::skip $name (version $version != tag $TAG_VERSION)"
              continue
            fi
            echo "::group::Publishing $name@$version"
            published=false
            for attempt in 1 2 3 4 5 6; do
              log="$(mktemp)"
              if cargo publish -p "$name" --token "${CARGO_REGISTRY_TOKEN}" 2>&1 | tee "$log"; then
                published=true
                rm -f "$log"
                break
              fi
              if grep -qiE 'already (uploaded|exists)|crate version .*already' "$log"; then
                echo "::warning::$name@$version is already on crates.io; continuing"
                published=true
                rm -f "$log"
                break
              fi
              echo "::warning::attempt $attempt for $name failed; retrying in 20s (index propagation)"
              rm -f "$log"
              sleep 20
            done
            if [ "$published" != true ]; then
              echo "::error::failed to publish $name@$version"
              exit 1
            fi
            echo "::endgroup::"
          done
