[workspace]

resolver = "2"

members = [
    "crates/lrdi",
    "crates/lrdi-macros",
]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"
repository = "https://gitcode.com/rf2026/RDI"

[workspace.dependencies]
thiserror = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
