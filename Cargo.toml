[workspace]

resolver = "2"

members = [
    "crates/rust-dicore",
    "crates/rust-dicore-macros",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
repository = "https://gitcode.com/rf2026/rust-di"

[workspace.dependencies]
thiserror = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
