[workspace]

resolver = "2"

members = [
    "crates/core",
    "crates/macros",
]

[workspace.package]
version = "0.8.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Rust-Framework/rust-dix"

[workspace.dependencies]
thiserror = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
