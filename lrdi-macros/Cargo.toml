[package]
name = "lrdi-macros"
version = "0.1.0"
edition = "2021"
description = "Procedural macros for lrdi — a Rust dependency injection framework"
license = "MIT"
repository = "https://gitcode.com/rf2026/RDI"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
