[package]
name = "rust-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "rust-core: shared contract types for the Rust Framework (application error carrier + stable error codes)"
license = "MIT"
repository = "https://github.com/Rust-Framework/rust-dix"
homepage = "https://rust-framework.github.io/rust-dix/"

[lib]
name = "rust_core"
doc = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
