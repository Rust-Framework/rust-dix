[package]
name = "rust-dicore"
version.workspace = true
edition.workspace = true
description = "rust-dicore: A Rust dependency injection framework inspired by Microsoft.Extensions.DependencyInjection"
license.workspace = true
repository.workspace = true
readme = "README.md"
include = ["README.md", "src/**/*", "tests/**/*"]
categories = ["rust-patterns", "asynchronous"]
keywords = ["di", "dependency-injection", "ioc", "rust-dicore", "service-provider"]

[dependencies]
thiserror.workspace = true
inventory = "0.3"
rust-dicore-macros = { path = "../rust-dicore-macros", version = "0.5.0" }

[features]
default = []

[lib]
doc = true
